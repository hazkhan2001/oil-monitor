name: tests
on:
  push:
    paths-ignore: ["state/**"]   # don't re-test on the bot's state commits
  workflow_dispatch: {}
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
