# Manual 90-second check of the AIS feed. Run it from the Actions tab (or `gh workflow run ais-probe`).
name: ais-probe
on:
  workflow_dispatch:
    inputs:
      world:
        description: "1 = subscribe to the whole world to measure coverage"
        default: "0"
      seconds:
        default: "90"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          PROBE_WORLD: ${{ inputs.world }}
          PROBE_SECONDS: ${{ inputs.seconds }}
        run: python run_ais_probe.py
